# Deploy naar ZAD (Operations Manager) via RijksICTGilde/zad-actions.
#
# Elke push/merge naar main bouwt de image (Gatus + config/) en deployt die naar de
# 'stable'-deployment. Een pull request draait de smoke test en krijgt een preview op
# een eigen deployment 'pr-<nummer>'; die wordt opgeruimd als de PR sluit. Previews
# hebben geen MATTERMOST_WEBHOOK_URL en sturen dus geen alerts.
#
# Vereiste repo-secrets:
#   ZAD_API_KEY — ZAD Operations Manager API key
#
# De Mattermost-webhook staat niet in de image maar als env-var
# MATTERMOST_WEBHOOK_URL op de deployment in Operations Manager (zie README.md).

name: ZAD Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

concurrency:
  group: zad-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR vereist lowercase; github.repository is MinBZK/... (hoofdletters) → hardcode lowercase.
  IMAGE_NAME: minbzk/moza-gatus
  ZAD_PROJECT_ID: mozag-on9

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test (build + start + endpoints geladen)
        run: CONTAINER_CLI=docker sh test/smoke.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # image pushen naar GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }} # immutable digest voor verse pull
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'push' && format('main-{0}', github.sha) || format('pr-{0}', github.event.number) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # GitHub environment/deployment aanmaken
      pull-requests: write # preview-url als PR-comment
    environment:
      name: ${{ github.event_name == 'push' && 'stable' || format('pr-{0}', github.event.number) }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deploy to ZAD
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: ${{ github.event_name == 'push' && 'stable' || format('pr-{0}', github.event.number) }}
          component: gatus
          # Deploy op digest (niet de mutable tag) zodat ZAD altijd de net gebouwde
          # image pullt i.p.v. een gecachete oude versie van dezelfde tag.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          wait-for-ready: 'true'
          health-endpoint: /health
          comment-on-pr: ${{ github.event_name == 'pull_request' }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: write # pr-image uit GHCR verwijderen
      pull-requests: write # preview-comment verwijderen
    steps:
      - name: Cleanup ZAD preview
        uses: RijksICTGilde/zad-actions/cleanup@v4
        with:
          api-key: ${{ secrets.ZAD_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT_ID }}
          deployment-name: pr-${{ github.event.number }}
          delete-pr-comment: 'true'
          delete-container: 'true'
          container-org: minbzk
          container-name: moza-gatus
          container-tag: pr-${{ github.event.number }}
