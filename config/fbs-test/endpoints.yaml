# Endpoints van de testomgeving van het Federatief Berichtenstelsel (MinBZK/moza-poc-fbs-berichtenbox,
# deployment `test` op ZAD). Previews (`pr-<n>`) staan hier bewust niet: die zijn tijdelijk.
#
# Geen eigen domein: alle componenten hangen onder het gedeelde ZAD-domein, dus de map en de group
# heten naar de omgeving.
#
# De Quarkus-diensten worden op /q/health/ready gecontroleerd, niet op een willekeurig pad: readiness
# telt hun opslag mee (Redis, PostgreSQL), dus een dienst die draait maar zijn werk niet kan doen telt
# als storing. Het demopaneel ontbreekt: dat staat achter een inlogmuur, en een muur die antwoordt
# zegt niets over het paneel erachter.
#
# failure-threshold 3 bij interval 2m: een melding na 4 tot 6 minuten, en een uitrol die een paar
# minuten 503 geeft blijft stil.
#
# Let op: de Redis-storingsknop in het demopaneel maakt de uitvraag bewust onbereikbaar. Het paneel
# kondigt dat vooraf in dit kanaal aan, onder de afzender "FBS Demo".
endpoints:
- name: fbs uitvraag
  group: fbs-test
  url: https://uitvraag-test-mpfb-8wh.rig.prd1.gn2.quattro.rijksapps.nl/q/health/ready
  interval: 2m
  conditions:
    - "[STATUS] == 200"
    - "[BODY].status == UP"
  alerts:
    - type: mattermost
      description: "healthcheck failed (fbs test) - uitvraag"
      failure-threshold: 3
      send-on-resolved: true
      minimum-reminder-interval: "15m"
